<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>WATT LINK | Smart Energy Trading Platform</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        html,
        body{

            width:100%;
            height:100%;

        }

        body{

            background:linear-gradient(135deg,#081321,#10223d);

            overflow:hidden;

        }

        #root{

            width:100%;
            height:100%;

        }

        .loader{

            width:100%;
            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            flex-direction:column;

            color:white;

            background:linear-gradient(135deg,#081321,#10223d);

        }

        .circle{

            width:90px;
            height:90px;

            border-radius:50%;

            border:8px solid rgba(255,255,255,.15);

            border-top:8px solid #00d4ff;

            animation:spin 1s linear infinite;

        }

        h1{

            margin-top:30px;

            font-size:42px;

            letter-spacing:4px;

            color:#00d4ff;

        }

        p{

            margin-top:15px;

            color:#cbd5e1;

            font-size:18px;

        }

        @keyframes spin{

            from{

                transform:rotate(0deg);

            }

            to{

                transform:rotate(360deg);

            }

        }

    </style>

</head>

<body>

<div id="root">

    <div class="loader">

        <div class="circle"></div>

        <h1>WATT LINK</h1>

        <p>Initializing Smart Energy Platform...</p>

    </div>

</div>

<script type="module" src="/src/main.jsx"></script>

</body>

</html>
